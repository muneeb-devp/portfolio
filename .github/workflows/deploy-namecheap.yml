name: Deploy to Namecheap

on:
    push:
        branches:
            - main
    workflow_dispatch:

concurrency:
    group: deploy-namecheap-${{ github.ref }}
    cancel-in-progress: true

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Build static export
              run: npm run build

            - name: Upload site to Namecheap
              uses: SamKirkland/FTP-Deploy-Action@v4.3.5
              with:
                  server: ${{ secrets.NAMECHEAP_SERVER }}
                  username: ${{ secrets.NAMECHEAP_USERNAME }}
                  password: ${{ secrets.NAMECHEAP_PASSWORD }}
                  protocol: ${{ secrets.NAMECHEAP_PROTOCOL || 'ftp' }}
                  server-dir: ${{ secrets.NAMECHEAP_SERVER_DIR }}
                  local-dir: ./out/
